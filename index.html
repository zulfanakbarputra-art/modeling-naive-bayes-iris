<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prediksi Spesies Iris - Naive Bayes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>

    <header>
      <h1>Prediksi Spesies Iris Dengan Perhitungan Gaussian</h1>
      <p id="info-model"></p>
    </header>

    <div class="isi-prediksi">
      <form id="form-prediksi">
        <div class="grup-ukuran">
          <div class="field">
            <label for="sepal-length">Sepal length (cm)</label>
            <input type="number" id="sepal-length" step="any" min="0" placeholder="5.1" required>
          </div>
          <div class="field">
            <label for="sepal-width">Sepal width (cm)</label>
            <input type="number" id="sepal-width" step="any" min="0" placeholder="3.2" required>
          </div>
          <div class="field">
            <label for="petal-length">Petal length (cm)</label>
            <input type="number" id="petal-length" step="any" min="0" placeholder="2.0" required>
          </div>
          <div class="field">
            <label for="petal-width">Petal width (cm)</label>
            <input type="number" id="petal-width" step="any" min="0" placeholder="3.1" required>
          </div>
        </div>
        <button type="submit" id="tombol-prediksi">Prediksi Semua Model</button>
      </form>

      <div class="hasil">
        <p id="hasil-spesies" style="font-size: 28px;"></p>
        <p id="hasil-keterangan">Isi ukuran bunga, lalu klik Prediksi</p>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
